# Cris Barber SaaS · Cloudflare
# Teste local:   npx wrangler dev            (usa D1 local, sem afetar a produção)
# Criar o banco: npx wrangler d1 create cris-barber-db   → copie o database_id abaixo
# Publicar:      npm run build && npx wrangler deploy

name = "cris-barber"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# assets estáticos (o build do Vite gera ./dist)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# banco de dados do SaaS (agendamentos, serviços, produtos, profissionais)
[[d1_databases]]
binding = "DB"
database_name = "cris-barber-db"
database_id = "SUBSTITUA-PELO-ID-DO-SEU-BANCO"

# Cris Barber SaaS · Cloudflare
# Teste local: npx wrangler dev
# Publicar: npm run build && npx wrangler deploy

name = "crisbarbearia"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Assets estáticos gerados pelo Vite
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Banco de dados D1
[[d1_databases]]
binding = "DB"
database_name = "cris-barber-db"
database_id = "9f17dd95-9cda-4e02-940a-e7adf8684c1a"
